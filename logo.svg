<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- 노트 종이 그라디언트 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5f3ff;stop-opacity:1"/>
    </linearGradient>
    <!-- 그림자 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <!-- 클립 -->
    <clipPath id="roundedClip">
      <rect x="56" y="56" width="400" height="400" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect x="56" y="56" width="400" height="400" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 배경 장식 원 -->
  <circle cx="420" cy="130" r="80" fill="white" fill-opacity="0.06" clip-path="url(#roundedClip)"/>
  <circle cx="100" cy="390" r="100" fill="white" fill-opacity="0.05" clip-path="url(#roundedClip)"/>

  <!-- 노트 종이 -->
  <rect x="148" y="136" width="216" height="264" rx="14" ry="14" fill="url(#paperGrad)" filter="url(#softShadow)"/>

  <!-- 노트 왼쪽 빨간 줄 (세로선) -->
  <line x1="186" y1="150" x2="186" y2="386" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 노트 가로 줄들 -->
  <line x1="196" y1="188" x2="348" y2="188" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="196" y1="214" x2="348" y2="214" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="196" y1="240" x2="348" y2="240" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="196" y1="266" x2="348" y2="266" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="196" y1="292" x2="348" y2="292" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="196" y1="318" x2="348" y2="318" stroke="#e5e7eb" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 텍스트 줄 (내용 암시) -->
  <!-- 첫 번째 줄 - 제목처럼 진하게 -->
  <rect x="196" y="178" width="110" height="8" rx="4" fill="#6366f1" opacity="0.85"/>
  <!-- 두 번째 줄 -->
  <rect x="196" y="204" width="140" height="6" rx="3" fill="#9ca3af" opacity="0.7"/>
  <!-- 세 번째 줄 -->
  <rect x="196" y="230" width="120" height="6" rx="3" fill="#9ca3af" opacity="0.7"/>
  <!-- 네 번째 줄 -->
  <rect x="196" y="256" width="130" height="6" rx="3" fill="#9ca3af" opacity="0.7"/>
  <!-- 다섯 번째 줄 -->
  <rect x="196" y="282" width="100" height="6" rx="3" fill="#9ca3af" opacity="0.7"/>

  <!-- 음표 아이콘 (오른쪽 하단, 노트 위) -->
  <g transform="translate(296, 300)" filter="url(#softShadow)">
    <!-- 음표 배경 원 -->
    <circle cx="36" cy="36" r="36" fill="#6366f1"/>
    <!-- 음표 심볼 (♪) -->
    <!-- 음표 머리 -->
    <ellipse cx="28" cy="46" rx="9" ry="7" fill="white" transform="rotate(-15, 28, 46)"/>
    <!-- 음표 기둥 -->
    <rect x="36" y="20" width="4" height="28" rx="2" fill="white"/>
    <!-- 음표 꼬리 -->
    <path d="M40 20 Q52 26 48 36" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 상단 링 바인더 구멍들 -->
  <circle cx="216" cy="148" r="7" fill="#e5e7eb"/>
  <circle cx="256" cy="148" r="7" fill="#e5e7eb"/>
  <circle cx="296" cy="148" r="7" fill="#e5e7eb"/>
  <circle cx="216" cy="148" r="4" fill="url(#bgGrad)"/>
  <circle cx="256" cy="148" r="4" fill="url(#bgGrad)"/>
  <circle cx="296" cy="148" r="4" fill="url(#bgGrad)"/>
</svg>
