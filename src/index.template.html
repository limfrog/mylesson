<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;-webkit-font-smoothing:auto}
    #root{min-height:100%}
    *{-webkit-text-size-adjust:100%}
    button{-webkit-appearance:none;cursor:pointer}
    input,textarea,select{-webkit-appearance:none}
    @media(max-width:767px){input,textarea,select{font-size:16px!important}}
    body{overscroll-behavior:none}

    :root {
      --bg:#f7f7fb; --surface:#ffffff; --surface2:#f9fafb; --surface3:#f3f4f6;
      --border:#f0f0f5; --border2:#e5e7eb;
      --text:#1f2937; --text-sub:#6b7280; --text-muted:#9ca3af;
      --accent:#6366f1; --accent-bg:#eef2ff;
      --input-bg:#fafafa; --input-border:#e5e7eb;
      --header-bg:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);
      --tab-bg:#ffffff; --tab-border:#f0f0f5;
      --card-bg:#ffffff; --card-border:#f0f0f5;
      --modal-bg:#ffffff; --overlay:rgba(15,15,35,0.6);
      --green:#10b981; --green-bg:#f0fdf4; --green-text:#065f46;
      --red:#ef4444; --red-bg:#fef2f2; --red-text:#b91c1c;
      --amber:#f59e0b; --amber-bg:#fffbeb; --amber-text:#92400e;
      --blue:#3b82f6; --blue-bg:#eff6ff; --blue-text:#1e40af;
      --purple-bg:#f5f3ff; --purple-text:#7c3aed;
      --drum-bg:#ffffff; --drum-hl:#eef2ff;
      --menu-bg:#ffffff; --menu-text:#1f2937;
      --scroll-thumb:rgba(0,0,0,0.15);
      --tab-active-color:#6366f1;
    }
    [data-theme="dark"] {
      --bg:#0f0f13; --surface:#1a1a24; --surface2:#22222f; --surface3:#2a2a3a;
      --border:#2e2e40; --border2:#3a3a50;
      --text:#e8e8f0; --text-sub:#9090b0; --text-muted:#555570;
      --accent:#818cf8; --accent-bg:#1e1e3a;
      --input-bg:#22222f; --input-border:#3a3a50;
      --header-bg:linear-gradient(135deg,#312e81 0%,#4c1d95 100%);
      --tab-bg:#1a1a24; --tab-border:#2e2e40;
      --card-bg:#1a1a24; --card-border:#2e2e40;
      --modal-bg:#1a1a24; --overlay:rgba(0,0,0,0.82);
      --green:#34d399; --green-bg:#042e1a; --green-text:#6ee7b7;
      --red:#f87171; --red-bg:#1f0a0a; --red-text:#fca5a5;
      --amber:#fbbf24; --amber-bg:#1c1202; --amber-text:#fde68a;
      --blue:#60a5fa; --blue-bg:#0c1829; --blue-text:#93c5fd;
      --purple-bg:#1e1232; --purple-text:#c4b5fd;
      --drum-bg:#1a1a24; --drum-hl:#1e1e3a;
      --menu-bg:#22222f; --menu-text:#e8e8f0;
      --scroll-thumb:rgba(255,255,255,0.1);
      --tab-active-color:#818cf8;
    }

    body,html{background:var(--bg)!important;color:var(--text)}
    .app-wrap{background:var(--bg);min-height:100vh;min-height:100dvh}
    .app-header{background:var(--header-bg)!important;transition:none!important;isolation:isolate;position:relative;z-index:120}
    @media(max-width:767px){.app-header{padding-left:max(20px,env(safe-area-inset-left))!important;padding-right:max(20px,env(safe-area-inset-right))!important}.app-header::before{content:"";position:absolute;left:0;right:0;top:-100px;height:100px;background:#6366f1;z-index:-1}[data-theme="dark"] .app-header::before{background:#312e81}}
    .app-header *{transition:none!important}
    .app-tabbar{background:var(--tab-bg);border-bottom:1.5px solid var(--tab-border)}
    .app-tab{color:var(--text-muted);border-bottom:2.5px solid transparent}
    .app-tab.active{color:var(--tab-active-color);border-bottom-color:var(--tab-active-color)}
    .app-card{background:var(--card-bg);border:1.5px solid var(--card-border);box-shadow:0 2px 8px rgba(0,0,0,0.04);border-radius:16px}
    [data-theme="dark"] .app-card{box-shadow:0 2px 8px rgba(0,0,0,0.3)}
    .app-modal-inner{background:var(--modal-bg)!important;color:var(--text)!important;border:1px solid var(--border)}
    .app-menu{background:var(--menu-bg)!important;border:1px solid var(--border)!important}
    .app-menu-item{color:var(--menu-text)!important;border-bottom-color:var(--border)!important}
    .app-menu-item:hover{background:var(--surface2)!important}
    .app-input{background:var(--input-bg);border:1.5px solid var(--input-border);color:var(--text);border-radius:10px;width:100%;padding:10px 13px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;box-sizing:border-box}
    .app-input::placeholder{color:var(--text-muted)}.app-input:focus{border-color:var(--accent);background:var(--surface)}
    .search-input{flex:1;padding:10px 14px;border-radius:12px;border:1.5px solid var(--input-border);font-size:14px;font-family:'Noto Sans KR',sans-serif;background:var(--surface);color:var(--text);outline:none}
    .search-input::placeholder{color:var(--text-muted)}.search-input:focus{border-color:var(--accent)}
    .syncbar-ok{background:var(--green-bg);border-bottom:1px solid rgba(16,185,129,0.3)}
    .syncbar-error{background:var(--red-bg);border-bottom:1px solid rgba(239,68,68,0.3)}
    .syncbar-syncing{background:var(--accent-bg);border-bottom:1px solid rgba(99,102,241,0.3)}
    .syncbar-idle{background:var(--surface2);border-bottom:1px solid var(--border)}
    .drum-container{background:var(--drum-bg);border:1.5px solid var(--accent-bg);border-radius:14px;overflow:hidden}
    [data-theme="dark"] .drum-container{border-color:var(--border2)}
    .drum-col{border-right:1px solid var(--border)}.drum-col:last-child{border-right:none}
    .drum-highlight{background:var(--drum-hl)!important}
    .cal-nav-btn{background:var(--surface3)!important;color:var(--text)!important}
    .badge-green{background:var(--green-bg);color:var(--green)}.badge-red{background:var(--red-bg);color:var(--red)}
    .badge-amber{background:var(--amber-bg);color:var(--amber)}.badge-blue{background:var(--blue-bg);color:var(--blue)}
    .badge-accent{background:var(--accent-bg);color:var(--accent)}
    .t-text-muted{color:var(--text-muted)!important}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}
        *,*::before,*::after{transition:background-color 0.2s,border-color 0.2s,color 0.15s}
    .app-header,.app-header *{transition:none!important}
    #lock-bg-inner,#lock-bg-inner *,#lock-bg-content,#lock-bg-content *{transition:none!important}

    /* ── 반응형 레이아웃 ── */
    /* 태블릿: 768px 이상 — 사이드바 + 콘텐츠 */
    @media(min-width:768px){
      body{display:flex;justify-content:center}
      .app-wrap{width:100%;max-width:100%!important;display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
      .app-header{grid-column:1/-1}
      .app-tabbar{display:none!important}
      .app-body{display:flex;flex:1;min-height:0}
      .app-sidebar{width:200px;flex-shrink:0;border-right:1.5px solid var(--tab-border);background:var(--tab-bg);display:flex;flex-direction:column;padding:16px 8px;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
      .app-sidebar-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:600;font-family:'Noto Sans KR',sans-serif;color:var(--text-muted);width:100%;text-align:left;transition:all 0.15s}
      .app-sidebar-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:800}
      .app-sidebar-btn:hover:not(.active){background:var(--surface2)}
      .app-content{flex:1;overflow-y:auto;padding:24px 24px 80px}
      .app-content-inner{max-width:900px;margin:0 auto}
      .student-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .student-grid-wide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    }
    /* 데스크톱: 1200px 이상 — 3열 */
    @media(min-width:1200px){
      .app-sidebar{width:220px}
      .app-content{padding:28px 32px 80px}
      .app-content-inner{max-width:1400px}
      .student-grid{grid-template-columns:1fr 1fr 1fr}
      .student-grid-wide{grid-template-columns:repeat(4,1fr)}
    }
    /* 모바일: 하단 탭바 유지 */
    @media(max-width:767px){
      .app-sidebar{display:none}
      .app-body{display:block}
      .app-content{padding:0}
      .app-content-inner{padding:0}
      .student-grid,.student-grid-wide{display:flex;flex-direction:column;gap:inherit}
    }
  

    /* ── UI refresh v2: iPhone / mobile commercial-style pass ── */
    @media(max-width:767px){
      /* iOS에서 Noto Sans KR 웹폰트가 900 weight로 합성될 때 생기는 흐릿한 가장자리를 피한다. */
      .app-wrap,.app-wrap *{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif!important}
      .app-wrap{max-width:540px!important;margin:0 auto!important;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}

      /* 헤더는 그라데이션/반투명 합성을 없애고 단색 레이어로 렌더링한다. */
      .app-header{position:relative!important;background:#5147d9!important;padding:max(18px,calc(env(safe-area-inset-top,0px) + 12px)) 16px 14px!important;border-bottom:1px solid rgba(255,255,255,.08);-webkit-font-smoothing:auto!important;text-rendering:optimizeLegibility!important}
      [data-theme="dark"] .app-header{background:#282263!important}
      .app-header::before{background:#5147d9!important}
      [data-theme="dark"] .app-header::before{background:#282263!important}
      .app-title{font-size:19px!important;font-weight:700!important;letter-spacing:-.35px!important;line-height:1.28!important;text-shadow:none!important;filter:none!important;-webkit-font-smoothing:auto!important;font-synthesis:none!important}
      .app-header-meta{font-size:12px!important;opacity:.78!important;margin-top:3px!important;font-weight:500!important}
      .app-drive-pill{display:none!important}
      .app-lang-switch{background:rgba(255,255,255,.13)!important;border:1px solid rgba(255,255,255,.08);border-radius:12px!important;padding:2px!important}
      .app-lang-switch button{min-height:34px!important;padding:4px 10px!important}
      .app-menu-wrap>button{width:40px!important;height:40px!important;border-radius:12px!important;background:rgba(255,255,255,.13)!important}
      /* 메뉴가 상세 화면/고정 탭바 뒤로 가려지지 않도록 viewport 기준으로 띄운다. */
      .app-menu{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 66px)!important;right:max(14px,env(safe-area-inset-right,0px))!important;left:auto!important;z-index:1001!important;max-width:calc(100vw - 28px)!important}
      .app-menu-wrap>div[style*="position: fixed"]{z-index:1000!important}

      /* 정상 동기화는 알림 바가 아니라 얇은 상태 행으로 보이게 한다. */
      .syncbar-ok{background:var(--surface)!important;border-bottom:1px solid var(--border)!important}
      .syncbar-ok,.syncbar-idle,.syncbar-syncing,.syncbar-error{min-height:36px;box-sizing:border-box}

      /* iOS 네이티브 앱과 같은 고정 하단 4탭. */
      .app-tabbar{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;z-index:80!important;max-width:540px;margin:0 auto!important;padding:4px 8px env(safe-area-inset-bottom,0px)!important;background:color-mix(in srgb,var(--tab-bg) 94%,transparent)!important;border-top:1px solid var(--tab-border)!important;border-bottom:0!important;box-shadow:0 -8px 24px rgba(16,24,40,.08);-webkit-backdrop-filter:saturate(140%) blur(16px);backdrop-filter:saturate(140%) blur(16px)}
      .app-tab{min-height:56px!important;padding:6px 2px 5px!important;border:0!important;border-radius:12px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;font-size:10.5px!important;font-weight:650!important;line-height:1.2!important;color:var(--text-muted)!important}
      .app-tab::before{display:block;font-size:20px;line-height:22px;font-weight:500;filter:grayscale(1);opacity:.78}
      .app-tab:nth-child(1)::before{content:"◉"}.app-tab:nth-child(2)::before{content:"✎"}.app-tab:nth-child(3)::before{content:"▦"}.app-tab:nth-child(4)::before{content:"⚙"}
      .app-tab.active{background:var(--accent-bg)!important;color:var(--accent)!important;border:0!important;font-weight:800!important}
      .app-tab.active::before{filter:none;opacity:1}

      .app-content-inner>div{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))!important}

      /* 학생/수업 목록의 첫 동작을 '검색 → 추가'로 명확하게 재배치. */
      .list-toolbar{display:flex!important;flex-wrap:wrap!important;gap:8px!important;margin-bottom:10px!important;align-items:center!important}
      .list-toolbar>.search-input{order:0!important;flex:0 0 100%!important;width:100%!important;height:46px!important;padding:0 15px!important;border-radius:14px!important;background:var(--surface)!important;border:1px solid var(--border2)!important;font-size:15px!important;box-shadow:0 1px 2px rgba(16,24,40,.03)}
      .list-toolbar>.search-input:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)!important}
      .list-toolbar>button{min-width:44px!important;height:42px!important;border-radius:12px!important}
      .list-toolbar>div{height:42px!important;border-radius:12px!important;padding:3px!important;margin-left:auto!important}
      .list-toolbar>div button{height:36px!important;min-width:36px!important}
      .list-toolbar>button:last-child{height:42px!important;min-width:86px!important;padding:0 18px!important;border-radius:12px!important;font-size:14px!important;font-weight:800!important}

      .sort-chips{gap:7px!important;margin:2px -14px 14px!important;padding:0 14px 2px!important;scroll-padding-left:14px!important}
      .sort-chips button{min-height:34px!important;padding:6px 12px!important;border-radius:17px!important;font-size:12px!important;background:var(--surface2)!important;border:1px solid var(--border)!important}
      .sort-chips button[style*="var(--accent)"]{box-shadow:none!important}
      .folder-mode-bar{padding:9px 12px!important;border-radius:12px!important;background:var(--surface)!important;border-color:var(--border)!important}

      /* 목록에서는 관리 버튼보다 학생 정보 자체에 집중한다. 수정/삭제는 상세 화면에서 제공. */
      .student-card .card-actions{display:none!important}
      .student-card{border-width:1px!important;box-shadow:0 1px 3px rgba(16,24,40,.055)!important}
      .student-card:hover{transform:none!important}

      /* 모바일 모달/폼의 터치 영역과 시각 밀도 통일. */
      .app-input{min-height:46px!important;border-radius:12px!important;font-size:15px!important}
      .app-card{border-width:1px!important;box-shadow:0 1px 3px rgba(16,24,40,.055)}
    }

  </style>
